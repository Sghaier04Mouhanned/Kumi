services:
  - type: web
    name: schedai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VISION_AGENT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
